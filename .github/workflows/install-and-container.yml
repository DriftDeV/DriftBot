name: Install & container

# Prove "lente": installano PyTorch e le dipendenze vere, costruiscono l'immagine Docker e la eseguono.
# Quelle veloci (con moduli finti al posto di torch & co.) stanno in tests.yml e girano a ogni push.
# Qui girano su main, sulle pull request che toccano installazione, codice o container, una volta a settimana
# (per accorgersi quando una dipendenza non fissata si rompe) e a mano.
on:
  push:
    branches: [main]
    paths:
      - Makefile
      - pyproject.toml
      - scripts/**
      - src/**
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/install-and-container.yml
  pull_request:
    paths:
      - Makefile
      - pyproject.toml
      - scripts/**
      - src/**
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/install-and-container.yml
  schedule:
    - cron: "0 5 * * 1"   # lunedì alle 05:00 UTC
  workflow_dispatch:

concurrency:
  group: install-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # con -eo pipefail: una pipe che fallisce a metà fa fallire il passo

jobs:
  # ---------------------------------------------------------------------------------------------
  # Il flusso del README (sezione 2B): `make install` / `make install-dev` su un venv nuovo, con le
  # dipendenze vere (PyTorch CPU, fairseq, rvc-python, chatterbox...), poi il bot deve essere operativo.
  # ---------------------------------------------------------------------------------------------
  install:
    name: Installazione locale (${{ matrix.flow }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: runtime        # solo ciò che serve per far girare il bot
            target: install
          - flow: sviluppo       # in più pytest, ruff, ecc.; esegue anche tutta la suite di test
            target: install-dev
    steps:
      - uses: actions/checkout@v4

      # Python 3.10 è la versione del progetto (Makefile: PYTHON := python3.10); fairseq 0.12.2 non regge le più nuove.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            Makefile
            scripts/install_deps.py

      # Librerie di sistema che il README chiede (FFmpeg, Opus per la voce, libsndfile, espeak-ng per /tts)
      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libopus0 espeak-ng libespeak-ng1 build-essential

      - name: make ${{ matrix.target }} GPU=cpu
        run: make ${{ matrix.target }} GPU=cpu

      - name: Le librerie importano davvero (PyTorch CPU, requests, yt-dlp, RVC, Chatterbox)
        run: |
          venv/bin/python - <<'EOF'
          import torch, torchaudio, discord, fairseq, rvc_python, chatterbox, pyttsx3, anthropic, librosa
          import requests, yt_dlp
          assert torch.version.cuda is None and torch.version.hip is None, "serve la build CPU di PyTorch"
          major, minor = (int(x) for x in requests.__version__.split(".")[:2])
          assert (major, minor) >= (2, 32), f"requests {requests.__version__}: yt-dlp vuole >= 2.32.2"
          print("torch", torch.__version__, "| requests", requests.__version__, "| yt-dlp", yt_dlp.version.__version__)
          EOF

      # Carica tutti i cog con le librerie vere e controlla che i comandi slash ci siano tutti
      - name: Cog operativi
        run: venv/bin/python scripts/smoke_cogs.py

      - name: PyTorch e dispositivo (make test-py)
        run: make test-py

      - name: Senza token il bot esce con un messaggio chiaro
        run: |
          set +e
          output=$(venv/bin/python src/main.py 2>&1)
          code=$?
          echo "$output" | tail -n 3
          test "$code" -eq 1
          echo "$output" | grep -q "DISCORD_TOKEN mancante"

      # Con le dipendenze vere installate (non i moduli finti) la suite deve passare lo stesso
      - name: Suite di test (make test)
        if: matrix.flow == 'sviluppo'
        run: make test

  # ---------------------------------------------------------------------------------------------
  # Il flusso del README (sezione 2A): l'immagine si costruisce, il container parte, i dati restano,
  # l'arresto è pulito e docker-compose.yml funziona.
  # ---------------------------------------------------------------------------------------------
  container:
    name: Container (build ed esecuzione)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PyTorch per CPU (default del Dockerfile). Le build CUDA/ROCm (TORCH_INDEX) scaricano GB di wheel
      # e non si possono eseguire qui: non sono provate dal workflow.
      - name: Build dell'immagine
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: driftbot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Utente senza privilegi e strumenti (Node, FFmpeg, espeak-ng)
        run: |
          test "$(docker run --rm driftbot:latest id -u)" = 1000
          docker run --rm driftbot:latest sh -c 'node --version && ffmpeg -version | head -n 1 && espeak-ng --version | head -n 1'

      - name: Librerie e Opus dentro l'immagine
        run: |
          docker run --rm driftbot:latest python -W ignore - <<'EOF'
          import torch, discord, fairseq, rvc_python, chatterbox, requests, yt_dlp
          assert torch.version.cuda is None and torch.version.hip is None, "l'immagine di default è per CPU"
          major, minor = (int(x) for x in requests.__version__.split(".")[:2])
          assert (major, minor) >= (2, 32), requests.__version__
          discord.opus._load_default()
          assert discord.opus.is_loaded(), "libopus non trovata: la voce di Discord non funzionerebbe"
          print("torch", torch.__version__, "| requests", requests.__version__, "| yt-dlp", yt_dlp.version.__version__)
          EOF

      # Lo script non è nell'immagine: lo si copia in /app (accanto a src/) con docker cp, che funziona
      # ovunque (un bind mount dipende dai permessi dell'host, es. SELinux)
      - name: Cog operativi dentro il container
        run: |
          id=$(docker create driftbot:latest python /app/smoke_cogs.py)
          docker cp scripts/smoke_cogs.py "$id:/app/smoke_cogs.py"
          docker start -a "$id" || { docker rm "$id" > /dev/null; exit 1; }
          docker rm "$id" > /dev/null

      - name: Senza token il container esce con un messaggio chiaro
        run: |
          set +e
          output=$(docker run --rm driftbot:latest 2>&1)
          code=$?
          echo "$output" | tail -n 3
          test "$code" -eq 1
          echo "$output" | grep -q "DISCORD_TOKEN mancante"

      # Dashboard (porta pubblicata, database nel volume), arresto pulito con SIGINT e dati che sopravvivono
      - name: Dashboard, volume e arresto pulito
        run: |
          docker volume create ci-data
          docker run -d --name ci-dash -p 127.0.0.1:18080:8080 -v ci-data:/app/src/cogs/data \
            -e DASHBOARD_PASSWORD=password-di-prova-123 -e DASHBOARD_HOST=0.0.0.0 -e DASHBOARD_PORT=8080 \
            driftbot:latest python src/dashboard_main.py
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -qi "DriftBot"
          docker exec ci-dash test -f /app/src/cogs/data/driftbot.sqlite3

          start=$(date +%s)
          docker stop ci-dash > /dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop: ${elapsed}s, exit code $(docker inspect ci-dash --format '{{.State.ExitCode}}')"
          test "$elapsed" -lt 10                                            # SIGINT gestito: niente attesa del SIGKILL
          test "$(docker inspect ci-dash --format '{{.State.ExitCode}}')" = 0
          docker rm ci-dash > /dev/null

          docker run --rm -v ci-data:/app/src/cogs/data driftbot:latest python -c "
          import sqlite3
          tables = sqlite3.connect('/app/src/cogs/data/driftbot.sqlite3').execute(\"select count(*) from sqlite_master where type='table'\").fetchone()[0]
          assert tables > 0, 'il database nel volume è vuoto'
          print('tabelle nel database dopo la ricreazione del container:', tables)"

      - name: Pulizia della prova della dashboard
        if: always()
        run: |
          docker rm -f ci-dash 2> /dev/null || true
          docker volume rm ci-data 2> /dev/null || true

      # Usa l'immagine appena costruita (driftbot:latest esiste: compose non ricostruisce). Il token finto basta:
      # il bot stampa il dispositivo di calcolo prima di collegarsi a Discord.
      - name: docker-compose.yml (configurazione, avvio e volumi)
        run: |
          echo "DISCORD_TOKEN=token-finto-non-valido" > .env
          docker compose config -q
          docker compose up -d
          for _ in $(seq 1 60); do docker compose logs bot 2>&1 | grep -q "Dispositivo di calcolo" && break; sleep 1; done
          docker compose logs bot 2>&1 | grep "Dispositivo di calcolo"
          docker compose ps --format '{{.Name}} {{.Ports}}' | grep -q "127.0.0.1:8080->8080/tcp"
          for volume in driftbot-data driftbot-rvc driftbot-cache; do
            docker volume ls --format '{{.Name}}' | grep -q "_${volume}$"
          done

      - name: Pulizia di compose
        if: always()
        run: docker compose down -v 2> /dev/null || true
