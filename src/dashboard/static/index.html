<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DriftBot · Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f5bd5'/%3E%3Cpath d='M9 14v4M13 10v12M17 7v18M21 12v8' fill='none' stroke='white' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>

  <noscript><p class="noscript">La dashboard richiede JavaScript.</p></noscript>

  <!-- Schermata di accesso -->
  <div id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="on">
      <div class="brand brand-large"><span class="brand-mark" aria-hidden="true"></span> DriftBot</div>
      <h1>Accedi alla dashboard</h1>
      <p class="muted">Inserisci la password impostata in <code>DASHBOARD_PASSWORD</code>.</p>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Accedi</button>
    </form>
  </div>

  <!-- Applicazione -->
  <div id="app-view" class="shell" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> DriftBot <span class="brand-sub">Dashboard</span></div>
      <div class="topbar-actions">
        <span id="bot-status" class="pill" title="Stato della connessione del bot a Discord (Online = collegato)">…</span>
        <button id="theme-toggle" class="btn btn-ghost btn-icon" type="button" aria-label="Cambia tema chiaro/scuro" title="Cambia tema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button id="logout" class="btn btn-ghost" type="button">Esci</button>
      </div>
    </header>

    <nav id="nav" class="nav" aria-label="Sezioni della dashboard">
      <a href="#/panoramica" data-route="panoramica">Panoramica</a>
      <a href="#/soundboard" data-route="soundboard">Soundboard</a>
      <a href="#/voci" data-route="voci">Voci clonate</a>
      <a href="#/rvc" data-route="rvc">Modelli RVC</a>
      <a href="#/server" data-route="server">Server</a>
      <a href="#/registro" data-route="registro">Registro</a>
    </nav>

    <main id="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="/static/app.js" defer></script>
</body>
</html>
